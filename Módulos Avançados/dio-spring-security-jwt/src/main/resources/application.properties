spring.application.name=dio-spring-security-jwt
# A aplicação só inicia com uma chave HS512 forte fornecida pelo ambiente.
# Gerar na própria máquina: openssl rand -base64 64
security.config.key=${JWT_SIGNING_KEY_BASE64:}
security.config.prefix=Bearer
security.config.expiration=3600000
server.port=${SERVER_PORT:8081}

# Somente banco H2 temporário para exercício; não habilitar console em ambiente público.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:security_demo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
